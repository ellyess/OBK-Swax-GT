<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Guild Banner Logo</title>
  <desc id="desc">Placeholder guild logo banner with GT Availability text.</desc>
  <defs>
    <linearGradient id="grad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#5a6bff"/>
      <stop offset="100%" stop-color="#5fd1ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="320" rx="32" fill="#111622"/>
  <rect x="12" y="12" width="1176" height="296" rx="24" fill="none" stroke="url(#grad)" stroke-width="4"/>
  <text x="600" y="150" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" fill="#eaf1ff">SWAX GUILD</text>
  <text x="600" y="230" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="600" fill="#9db6ff">GT AVAILABILITY</text>
</svg>
