<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Guild Background</title>
  <desc id="desc">Abstract dark gradient background for guild dashboard.</desc>
  <defs>
    <radialGradient id="g1" cx="18%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#2732a8" stop-opacity="0.8"/>
