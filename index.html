<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guild GT Availability</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.2/core.css" />
    <link rel="stylesheet" href="./styles.css?v=20260225-2" />
    <script src="./config.js?v=20260225-2"></script>
    <script type="module" src="https://pyscript.net/releases/2025.2.2/core.js"></script>
  </head>
  <body>
    <main class="container">
      <img id="guild-logo" class="guild-logo" alt="Guild Logo" />
      <h1>GT Availability</h1>
      <!-- <p class="muted">Track guild availability and attacks (0-3).</p> -->
      <p id="local-time-note" class="muted">Times are shown in your local timezone.</p>
      <p class="hero-link-row">
        <a
          class="hero-link-btn"
          href="https://obk-gear-optimiser.streamlit.app/"
          target="_blank"
          rel="noopener noreferrer"
          >OPEN EQUIPMENT OPTIMISER</a
        >
      </p>

      <section class="card">
        <h2>GUILD ACCESS</h2>
        <div class="row">
          <label for="guild-passcode">PASSCODE</label>
          <input id="guild-passcode" type="password" placeholder="ENTER GUILD PASSCODE" />
          <button id="join-guild-btn" py-click="join_guild">ENTER</button>
          <button id="clear-guild-btn" py-click="clear_guild">CLEAR</button>
        </div>
        <p id="guild-active" class="muted">ENTER PASSCODE</p>
      </section>

      <section class="card">
        <h2>MEMBER SELECTION</h2>
        <div class="row">
          <label for="member-name">MEMBER NAME</label>
          <input id="member-name" type="text" list="member-names" placeholder="e.g. ellyess" />
          <datalist id="member-names"></datalist>
          <button id="load-profile-btn" py-click="load_profile">LOAD</button>
          <button id="save-member-btn" py-click="save_member">SAVE</button>
        </div>

        <div class="row attacks-row">
          <label for="attacks-used">ATTACKS USED</label>
          <input id="attacks-used" type="range" min="0" max="3" value="0" py-input="render_attack_value" />
          <strong id="attacks-value">0 / 3</strong>
        </div>
        <p id="reset-countdown" class="muted reset-countdown">Reset in --d --h --m --s (local target time)</p>
        <p id="reset-next" class="muted reset-next">Next reset: ---- -- -- --:-- (local time)</p>
        <p id="status" class="status">Ready.</p>

        <div id="slot-grid" class="slot-grid"></div>
      </section>

      <section class="card">
        <h2>GUILD OVERVIEW</h2>
        <table>
          <thead>
            <tr>
              <th>MEMBER</th>
              <th>ATTACKS</th>
              <th>AVAILABLE SLOTS</th>
            </tr>
          </thead>
          <tbody id="roster-body"></tbody>
        </table>
      </section>
    </main>

    <script type="py" src="./app.py?v=20260225-2"></script>
  </body>
</html>
